<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IconAid</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2933; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8fa; }
    header { position: sticky; top: 0; z-index: 2; padding: 14px 14px 10px; background: #fff; border-bottom: 1px solid #d9dee7; }
    h1 { margin: 0 0 10px; font-size: 18px; font-weight: 650; letter-spacing: 0; }
    .filters { display: grid; grid-template-columns: 1fr 88px; gap: 8px; }
    input, select { width: 100%; min-width: 0; height: 34px; padding: 0 9px; border: 1px solid #b8c0cc; border-radius: 4px; background: #fff; color: inherit; font: inherit; }
    input:focus, select:focus { outline: 2px solid #2f6fed; outline-offset: -1px; border-color: #2f6fed; }
    .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; color: #5f6b7a; font-size: 12px; }
    .color-wrap { display: flex; align-items: center; gap: 6px; }
    input[type="color"] { width: 30px; height: 26px; padding: 2px; border-radius: 4px; }
    main { padding: 12px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .icon { min-width: 0; height: 100px; padding: 8px 5px 6px; border: 1px solid #d8dee8; border-radius: 6px; background: #fff; color: #1f497d; cursor: pointer; }
    .icon:hover { border-color: #2f6fed; background: #f4f7ff; }
    .icon:focus-visible { outline: 2px solid #2f6fed; outline-offset: 1px; }
    .icon[disabled] { cursor: wait; opacity: .55; }
    .icon svg { display: block; width: 52px; height: 52px; margin: 0 auto 5px; overflow: visible; }
    .icon span { display: -webkit-box; overflow: hidden; color: #25313f; font-size: 11px; line-height: 14px; text-align: center; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .empty { padding: 36px 12px; color: #667281; text-align: center; }
    #sentinel { height: 2px; }
    #status { position: sticky; bottom: 0; min-height: 30px; padding: 7px 12px; border-top: 1px solid #d9dee7; background: #fff; color: #5f6b7a; font-size: 12px; }
    #status.error { color: #b42318; }
    #status.success { color: #157347; }
    @media (min-width: 430px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header>
    <h1>IconAid</h1>
    <div class="filters">
      <input id="search" type="search" placeholder="Search 425 icons" autocomplete="off">
      <select id="category" aria-label="Category"><option value="">All</option></select>
    </div>
    <div class="meta">
      <span id="count">Loading...</span>
      <label class="color-wrap">Color <input id="color" type="color" value="#1f497d"></label>
    </div>
  </header>
  <main>
    <div id="grid" class="grid"></div>
    <div id="sentinel"></div>
  </main>
  <div id="status">Select an icon to insert it.</div>
  <script src="taskpane.js?v=1.0.2"></script>
</body>
</html>
