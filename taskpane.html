<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Slide Aid — Icons</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --hover: #f3f4f6;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; font-size: 13px; }

  .bar { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line);
         padding: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .row { display: flex; gap: 6px; align-items: center; }
  #search { flex: 1; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; outline: none; }
  #search:focus { border-color: var(--accent); }
  select, input[type=color] { border: 1px solid var(--line); border-radius: 6px; padding: 5px; background: var(--bg); color: var(--fg); }
  input[type=color] { width: 34px; height: 30px; padding: 2px; }
  .meta { display: flex; justify-content: flex-end; color: var(--muted); font-size: 11px; }

  #grid { flex: 1; overflow-y: auto; padding: 8px;
          display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 4px; align-content: start; }
  .cell { position: relative; border: 1px solid transparent; border-radius: 8px; padding: 6px 4px 5px; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
  .cell:hover { background: var(--hover); border-color: var(--line); }
  .badge { position: absolute; top: 3px; right: 3px; font-size: 8px; line-height: 1; letter-spacing: .2px;
           padding: 2px 3px; border-radius: 3px; opacity: .55; pointer-events: none; }
  .cell:hover .badge { opacity: 1; }
  .b-fill { background: var(--accent); color: #fff; }
  .b-line { background: var(--line); color: var(--muted); }
  .cell svg { width: 34px; height: 34px; display: block; }
  .cap { font-size: 9.5px; color: var(--muted); line-height: 1.15; max-width: 100%;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sentinel { grid-column: 1 / -1; height: 1px; }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 32px 8px; }
  #status { border-top: 1px solid var(--line); padding: 6px 8px; color: var(--muted); font-size: 11px; min-height: 16px; }
  #status.success { color: #15803d; } #status.error { color: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f2430; --fg:#e5e7eb; --muted:#9aa4b2; --line:#374151; --hover:#2b3240; }
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="row">
      <input id="search" type="search" placeholder="Search 54,000+ icons — chart, arrow, cloud…" autocomplete="off" />
      <input id="color" type="color" value="#1f2937" title="Preview / insert color" />
    </div>
    <div class="row">
      <select id="category"><option value="">All categories</option></select>
      <select id="style" title="Filter by icon style">
        <option value="">All styles</option>
        <option value="line">Line only</option>
        <option value="fill">Has fill</option>
      </select>
      <div class="meta" style="flex:1;"><span id="count"></span></div>
    </div>
  </div>
  <div id="grid"><div id="sentinel"></div></div>
  <div id="status">Loading icon catalog…</div>
  <script src="taskpane.js?v=7"></script>
</body>
</html>
